<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini - Supercharge your creativity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        .menu-icon {
            background: none;
            border: none;
            color: #a0a0a0;
            cursor: pointer;
            padding: 0.5rem;
        }

        main {
            display: flex;
            min-height: calc(100vh - 180px);
            padding: 2rem;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .gradient-text {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(to right, #3d389e, #00f7ff, #00aeff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: bold;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: #a0a0a0;
            line-height: 1.5;
        }

        .cta-button {
            display: inline-block;
            background: none;
            border: 1.5px solid white;
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 0.375rem;
            font-weight: 550;
            transition:  0.5s ease-in-out;
        }

        .cta-button:hover {
            background: linear-gradient(to right, #272283, #018cff, #000000);
            transition:  0.5s ease-in-out;
        }

        .hero-image {
            width: 100%;
            height: auto;
            border-radius: 1rem;
            object-fit: cover;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 1rem 2rem;
            border-top: 1px solid #333;
            background-color: #1a1a1a;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-content a {
            color: #a0a0a0;
            text-decoration: none;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .hero-image {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .nav-links a {
                display: none;
            }

            .hero-title {
                font-size: 2rem;
            }

            .gradient-text {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">OSL / Modern Marketing</a> 
        <div class="nav-links">
            <a href="#">Try OSL Agency</a>
            <a href="#">For enterpreneurs</a>
            <a href="#">For influencer</a>
            <a href="#">FAQ</a>
            <button class="menu-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <main>
        <div class="content-wrapper">
            <div class="hero-content">
                <div>
                    <h1 class="gradient-text">OSL</h1>
                    <h2 class="hero-title">
                        Supercharge your creativity<br>
                        and productivity
                    </h2>
                    <p class="hero-subtitle">
                        Find perfect Social-Media Marketing Partners on your budget<br>
                       Social Media Marketing Forum
                    </p>
                </div>
                <a href="index2.html" class="cta-button">Start Now --></a>
            </div>
            <div>
                <img src="https://source.unsplash.com/random/800x600/?nature,camping" alt="Person with dog outdoors" class="hero-image">
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <a href="#">OSL /  Startups & Influencer Connection </a>
            <a href="#">Privacy & Terms</a>
        </div>
    </footer>
</body>
</html>
